[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "clouddownloader"
version = "0.1.0"
description = "Headless-browser file downloads from cloud share links (Google Drive, Dropbox, SharePoint, OneDrive, Box, WeTransfer)."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
keywords = [
    "playwright", "headless-browser", "download", "cloud-storage",
    "google-drive", "dropbox", "sharepoint", "onedrive", "box", "wetransfer",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = ["playwright>=1.40"]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "mypy>=1.5",
    "ruff>=0.1",
]

[project.scripts]
clouddownloader = "clouddownloader.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/clouddownloader"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "browser: needs a real Chromium (pytest -m browser)",
]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = true
